spring.application.name=noticore-api

#port decalration
server.port=8080

#database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/noticore
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false

#hikari configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

#liquibase configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:changelog-master.xml

#brevo configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
brevo.api.key=${BREVO_API_KEY}
brevo.webhook.secret=${BREVO_WEBHOOK_SECRET:}

#rabbitmq configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=Kiran@300805

#rapidapi configuration
rapidapi.proxy.secret=${RAPIDAPI_PROXY_SECRET:local-dev-secret}